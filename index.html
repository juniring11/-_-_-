
<style>
  .vote-wrap { padding: 1rem 0; }
  .vote-header { text-align: center; margin-bottom: 1.5rem; }
  .vote-header h2 { font-size: 17px; font-weight: 500; color: var(--color-text-primary); margin: 0 0 4px; }
  .vote-header p { font-size: 13px; color: var(--color-text-secondary); margin: 0; }
  .candidates { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-bottom: 1.5rem; }
  .card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem 1rem; cursor: pointer; transition: border-color 0.15s; position: relative; }
  .card:hover { border-color: var(--color-border-secondary); }
  .card.selected { border: 2px solid #0F6E56; }
  .card.voted { cursor: default; }
  .card-num { font-size: 11px; color: var(--color-text-tertiary); letter-spacing: 2px; margin-bottom: 6px; }
  .card-title { font-size: 20px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 4px; }
  .card-sub { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 12px; }
  .card-desc { font-size: 12px; color: var(--color-text-secondary); line-height: 1.6; margin-bottom: 14px; }
  .bar-wrap { background: var(--color-background-secondary); border-radius: 4px; height: 6px; overflow: hidden; margin-bottom: 6px; }
  .bar { height: 6px; border-radius: 4px; background: #1D9E75; transition: width 0.5s ease; }
  .bar-info { display: flex; justify-content: space-between; font-size: 12px; }
  .bar-count { color: var(--color-text-primary); font-weight: 500; }
  .bar-pct { color: var(--color-text-secondary); }
  .check { position: absolute; top: 10px; right: 10px; width: 18px; height: 18px; border-radius: 50%; background: #1D9E75; display: none; align-items: center; justify-content: center; }
  .check svg { width: 10px; height: 10px; }
  .card.selected .check { display: flex; }
  .vote-btn { display: block; width: 100%; padding: 10px; background: #1D4E35; color: #fff; border: none; border-radius: var(--border-radius-md); font-size: 15px; font-weight: 500; cursor: pointer; margin-bottom: 1rem; }
  .vote-btn:disabled { opacity: 0.4; cursor: default; }
  .vote-btn:hover:not(:disabled) { background: #0F6E56; }
  .total-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--color-background-secondary); border-radius: var(--border-radius-md); font-size: 13px; }
  .total-row span { color: var(--color-text-secondary); }
  .total-row strong { color: var(--color-text-primary); }
  .msg { text-align: center; font-size: 13px; color: var(--color-text-secondary); margin-top: 8px; min-height: 20px; }
  .tag { display: inline-block; font-size: 11px; background: #E1F5EE; color: #0F6E56; border-radius: 20px; padding: 2px 8px; margin-bottom: 8px; }
</style>

<div class="vote-wrap">
  <h2 class="sr-only">강화선원교회 연합예배 이름 온라인 투표</h2>
  <div class="vote-header">
    <h2>"가족사랑주일" 이름을 대신할 새로운 이름을 골라주세요!</h2>
    <p>강화선원교회 · 2026</p>
  </div>

  <div class="candidates" id="cards"></div>

  <button class="vote-btn" id="voteBtn" disabled>투표하기</button>
  <div class="total-row">
    <span>총 투표 수</span>
    <strong id="totalCount">0표</strong>
  </div>
  <div class="msg" id="msg"></div>
</div>

<script>
const OPTIONS = [
  { id: "onbit",    num: "01", title: "온빛예배",   sub: "온 세대가 빛 안에서 함께",   desc: "'온(全) 세대'와 '빛으로 오신 그리스도'를 담은 이름. 모든 세대가 한 빛 아래 모여 드리는 예배." },
  { id: "hanjari",  num: "02", title: "한자리예배", sub: "온 세대가 한자리에",          desc: "유치부부터 장년까지 모든 세대가 한자리에 모여 드리는 예배. 가장 직관적인 이름." },
  { id: "ieum",     num: "03", title: "이음예배",   sub: "세대와 세대를 잇다",          desc: "기성세대의 신앙이 다음세대로 이어지고 연결되는 예배. 세대 간 연결을 꿈꾸는 이름." },
];

let selected = null;
let hasVoted = false;
let votes = { onbit: 0, hanjari: 0, ieum: 0 };

async function loadVotes() {
  try {
    for (const opt of OPTIONS) {
      const r = await window.storage.get('vote_' + opt.id, true);
      if (r) votes[opt.id] = parseInt(r.value) || 0;
    }
  } catch(e) {}
  render();
}

function total() { return votes.onbit + votes.hanjari + votes.ieum; }

function pct(id) {
  const t = total();
  return t === 0 ? 0 : Math.round(votes[id] / t * 100);
}

function render() {
  const t = total();
  document.getElementById('totalCount').textContent = t + '표';
  const cards = document.getElementById('cards');
  cards.innerHTML = OPTIONS.map(opt => `
    <div class="card${selected === opt.id ? ' selected' : ''}${hasVoted ? ' voted' : ''}" onclick="pick('${opt.id}')">
      <div class="check"><svg viewBox="0 0 10 10" fill="none"><polyline points="1.5,5 4,7.5 8.5,2.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="card-num">CANDIDATE ${opt.num}</div>
      ${hasVoted ? `<div class="tag">${pct(opt.id)}%</div>` : ''}
      <div class="card-title">${opt.title}</div>
      <div class="card-sub">${opt.sub}</div>
      <div class="card-desc">${opt.desc}</div>
      <div class="bar-wrap"><div class="bar" style="width:${hasVoted ? pct(opt.id) : 0}%"></div></div>
      <div class="bar-info">
        <span class="bar-count">${votes[opt.id]}표</span>
        <span class="bar-pct">${hasVoted ? pct(opt.id) + '%' : '-'}</span>
      </div>
    </div>
  `).join('');
}

function pick(id) {
  if (hasVoted) return;
  selected = id;
  document.getElementById('voteBtn').disabled = false;
  render();
}

async function castVote() {
  if (!selected || hasVoted) return;
  hasVoted = true;
  votes[selected]++;
  document.getElementById('voteBtn').disabled = true;
  document.getElementById('voteBtn').textContent = '투표 완료!';
  document.getElementById('msg').textContent = '소중한 한 표 감사합니다 🌿';
  try {
    await window.storage.set('vote_' + selected, String(votes[selected]), true);
  } catch(e) {}
  render();
}

document.getElementById('voteBtn').addEventListener('click', castVote);

loadVotes();
</script>
